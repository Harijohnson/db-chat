<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>chat-db</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --text: #e6e9ef; --muted: #8b93a3; --accent: #4f8cff;
    --ok: #2ecc71; --warn: #f1c40f; --err: #ff6b6b; --tool: #b58cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font: 15px/1.5 -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--text);
  }
  header {
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .badge {
    font-size: 12px; color: var(--muted); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 999px;
  }
  header .spacer { flex: 1; }
  header input {
    background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 6px; padding: 5px 8px; font-size: 12px; width: 130px;
  }
  header button {
    background: transparent; border: 1px solid var(--line); color: var(--muted);
    border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  header button:hover { color: var(--text); border-color: var(--accent); }

  #log { flex: 1; overflow-y: auto; padding: 20px; max-width: 860px; width: 100%; margin: 0 auto; }
  .msg { margin: 10px 0; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 9px 13px; border-radius: 12px; max-width: 78%; white-space: pre-wrap;
    word-break: break-word;
  }
  .user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 3px; }
  .ai .bubble   { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 3px; }

  .event {
    max-width: 820px; margin: 6px 0; font-size: 13px; font-family: ui-monospace, Menlo, Consolas, monospace;
    border-left: 3px solid var(--line); padding: 6px 12px; color: var(--muted); background: #12151c;
    border-radius: 0 6px 6px 0; white-space: pre-wrap; word-break: break-word;
  }
  .event.tool   { border-left-color: var(--tool); color: #d9c9ff; }
  .event.result { border-left-color: #3a4152; }
  .event.error  { border-left-color: var(--err); color: var(--err); }
  .event.info   { border-left-color: var(--warn); color: var(--warn); }

  .confirm {
    max-width: 820px; margin: 10px 0; padding: 12px 14px; border-radius: 10px;
    background: #1e1a0f; border: 1px solid #4a3f16;
  }
  .confirm .action {
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px;
    color: var(--warn); margin-bottom: 10px; white-space: pre-wrap; word-break: break-word;
  }
  .confirm .row { display: flex; gap: 10px; }
  .confirm button { border: none; border-radius: 7px; padding: 7px 16px; font-size: 13px; cursor: pointer; font-weight: 600; }
  .confirm .approve { background: var(--ok); color: #06210f; }
  .confirm .decline { background: #3a3f4b; color: var(--text); }
  .confirm button:disabled { opacity: .5; cursor: default; }
  .confirm .settled { font-size: 12px; color: var(--muted); margin-top: 4px; }

  footer { border-top: 1px solid var(--line); padding: 14px; background: var(--panel); }
  .composer { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; }
  #input {
    flex: 1; resize: none; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 10px; padding: 11px 13px; font: inherit; max-height: 140px;
  }
  #send {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 0 20px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 860px; margin: 8px auto 0; font-size: 12px; color: var(--muted); }
  code { background: #232833; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <h1>chat-db</h1>
    <span class="badge" id="dbBadge">db: …</span>
    <span class="spacer"></span>
    <label class="badge" style="border:none;padding:0">model
      <input id="model" value="qwen3:1.7b" />
    </label>
    <button id="reset">Reset</button>
  </header>

  <div id="log"></div>

  <footer>
    <div class="composer">
      <textarea id="input" rows="1" placeholder="e.g. add a student named hari with password Pass@123"></textarea>
      <button id="send">Send</button>
    </div>
    <div class="hint">
      Try: <code>add an event on 10 Oct 10 AM</code> ·
      <code>rename student hari to harikrishnan</code> ·
      <code>list all students</code>. Writes ask for your approval first.
    </div>
  </footer>

<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const send = document.getElementById("send");
const modelInput = document.getElementById("model");
const dbBadge = document.getElementById("dbBadge");
const resetBtn = document.getElementById("reset");

let sessionId = null;
let cursor = 0;
let polling = false;

function el(cls, text) {
  const d = document.createElement("div");
  d.className = cls;
  if (text !== undefined) d.textContent = text;
  return d;
}
function scroll() { log.scrollTop = log.scrollHeight; }

function addBubble(role, text) {
  const wrap = el("msg " + role);
  const b = el("bubble", text);
  wrap.appendChild(b);
  log.appendChild(wrap);
  scroll();
}

function renderEvent(ev) {
  if (ev.type === "tool") {
    log.appendChild(el("event tool", "→ " + ev.name + "(" + JSON.stringify(ev.arguments) + ")"));
  } else if (ev.type === "result") {
    log.appendChild(el("event result", ev.content));
  } else if (ev.type === "error") {
    log.appendChild(el("event error", ev.content));
  } else if (ev.type === "info") {
    log.appendChild(el("event info", ev.content));
  } else if (ev.type === "answer") {
    if (ev.content) addBubble("ai", ev.content);
  } else if (ev.type === "confirm") {
    renderConfirm(ev);
  }
  scroll();
}

function renderConfirm(ev) {
  const box = el("confirm");
  box.appendChild(el("action", "⚠ Approve this database write?\n" + ev.action));
  const row = el("row");
  const approve = el("button approve", "Approve");
  const decline = el("button decline", "Decline");
  approve.className = "approve"; decline.className = "decline";
  const settle = (approved) => {
    approve.disabled = decline.disabled = true;
    fetch("/api/confirm", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, id: ev.id, approved }),
    });
    box.appendChild(el("settled", approved ? "✓ Approved" : "✕ Declined"));
  };
  approve.onclick = () => settle(true);
  decline.onclick = () => settle(false);
  row.appendChild(approve); row.appendChild(decline);
  box.appendChild(row);
  log.appendChild(box);
}

async function poll() {
  if (polling) return;
  polling = true;
  try {
    while (true) {
      const r = await fetch(`/api/events?session_id=${sessionId}&cursor=${cursor}`);
      const data = await r.json();
      cursor = data.cursor;
      data.events.forEach(renderEvent);
      // The worker sets busy=false only after the final "done" event, so this
      // keeps polling through tool calls and while waiting on a confirm.
      if (!data.busy) break;
      await new Promise(res => setTimeout(res, 500));
    }
  } finally {
    polling = false;
    setBusy(false);
  }
}

function setBusy(b) {
  send.disabled = b;
  input.disabled = b;
  if (!b) input.focus();
}

async function submit() {
  const text = input.value.trim();
  if (!text || send.disabled) return;
  addBubble("user", text);
  input.value = "";
  input.style.height = "auto";
  setBusy(true);
  try {
    const r = await fetch("/api/message", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text, session_id: sessionId, model: modelInput.value.trim() }),
    });
    if (!r.ok) {
      const e = await r.json();
      log.appendChild(el("event error", e.detail || "Request failed."));
      setBusy(false);
      return;
    }
    const data = await r.json();
    sessionId = data.session_id;
    poll();
  } catch (err) {
    log.appendChild(el("event error", "Network error: " + err));
    setBusy(false);
  }
}

send.onclick = submit;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

resetBtn.onclick = async () => {
  if (!sessionId) { log.innerHTML = ""; return; }
  await fetch(`/api/reset?session_id=${sessionId}`, { method: "POST" });
  log.innerHTML = "";
  cursor = 0;
};

// Load model + db status on start.
fetch("/api/info").then(r => r.json()).then(info => {
  modelInput.value = info.model;
  dbBadge.textContent = info.supabase_configured ? "db: connected" : "db: NOT configured";
  dbBadge.style.color = info.supabase_configured ? "var(--ok)" : "var(--err)";
});
input.focus();
</script>
</body>
</html>
